<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV">
<meta name="theme-color" content="#000000">
<title>TV Remote</title>
<style>
  :root { --glass: rgba(255,255,255,.08); --glass-2: rgba(255,255,255,.14); --edge: rgba(255,255,255,.16);
          --fg:#fff; --mut:rgba(255,255,255,.62); --ok:#34c759; --bad:#ff453a; --acc:#0a84ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html { background:#000; }
  body { margin:0; min-height:100%; color:var(--fg);
              font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif; }
  .bg { position:fixed; inset:-40px; background:url(bg.jpg) center/cover; filter:blur(30px) saturate(1.4) brightness(.55); transform:scale(1.1); z-index:-1; }
  main { max-width:460px; margin:auto; padding:max(18px,env(safe-area-inset-top)) 18px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; margin:6px 2px 18px; }
  h1 { font-size:30px; font-weight:700; letter-spacing:-.02em; margin:0; }
  .pill { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--mut); background:var(--glass); border:1px solid var(--edge);
          padding:6px 11px; border-radius:99px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .dot { width:8px; height:8px; border-radius:50%; background:#888; box-shadow:0 0 10px currentColor; }
  .glass { background:var(--glass); border:1px solid var(--edge); border-radius:26px; padding:16px;
           backdrop-filter:blur(30px) saturate(1.6); -webkit-backdrop-filter:blur(30px) saturate(1.6); margin-bottom:14px;
           box-shadow:0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12); }
  .lbl { font-size:13px; font-weight:600; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; margin:2px 4px 12px; }
  .field { display:flex; gap:8px; }
  input { -webkit-user-select:text; user-select:text; flex:1; min-width:0; background:rgba(0,0,0,.28); border:1px solid var(--edge);
          color:#fff; border-radius:16px; padding:15px 16px; font-size:16px; outline:none; }
  input::placeholder { color:rgba(255,255,255,.4); }
  input:focus { border-color:rgba(255,255,255,.4); }
  button { font:inherit; color:#fff; background:var(--glass-2); border:1px solid var(--edge); border-radius:16px; cursor:pointer;
           transition:transform .12s, background .2s; }
  button:active { transform:scale(.94); background:rgba(255,255,255,.24); }
  .play { width:100%; margin-top:10px; padding:15px; font-weight:600; font-size:17px; background:#fff; color:#000; border:0; }
  .play:disabled { opacity:.5; }
  .paste { width:54px; display:flex; align-items:center; justify-content:center; }
  .msg { font-size:14px; min-height:19px; margin:10px 4px 0; color:var(--mut); }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  .quick { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .quick button { aspect-ratio:1; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:12px; color:var(--mut); padding:6px; }
  .quick svg { width:30px; height:30px; }
  .quick .ps { background:linear-gradient(140deg,#1d4fd8,#0b1f63); color:#cfe0ff; }
  /* Apple-TV-style clickpad */
  .pad { position:relative; width:250px; height:250px; margin:8px auto 18px; border-radius:50%;
         background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.16), rgba(255,255,255,.05)); border:1px solid var(--edge);
         box-shadow:inset 0 2px 10px rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.4); }
  .pad button { position:absolute; background:transparent; border:0; color:rgba(255,255,255,.75); font-size:22px; width:70px; height:70px; border-radius:50%; }
  .pad .u { top:6px; left:90px; } .pad .d { bottom:6px; left:90px; } .pad .l { left:6px; top:90px; } .pad .r { right:6px; top:90px; }
  .pad .c { width:96px; height:96px; left:77px; top:77px; background:rgba(255,255,255,.14); border:1px solid var(--edge); font-size:15px; font-weight:600; color:#fff; }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px; }
  .row button { height:58px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
  .row svg { width:24px; height:24px; }
  .apps { display:flex; flex-wrap:wrap; gap:8px; }
  .apps button { padding:9px 14px; border-radius:99px; font-size:14px; }
  .hist div { padding:12px 4px; border-top:1px solid rgba(255,255,255,.08); font-size:15px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist div:first-of-type { border-top:0; }
  .connect { text-align:center; padding:40px 20px; color:var(--mut); }
  .connect b { color:#fff; display:block; font-size:20px; margin-bottom:8px; }
  /* now playing */
  .np-title { font-size:19px; font-weight:700; line-height:1.25; margin:2px 4px 2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .np-state { font-size:13px; color:var(--mut); margin:0 4px 14px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:6px; padding:0; border:0;
    background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.22) var(--p,0%)); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.4); }
  .times { display:flex; justify-content:space-between; font-size:13px; color:var(--mut); margin:8px 2px 12px; font-variant-numeric:tabular-nums; }
  .ctrl { display:flex; gap:8px; align-items:center; } .ctrl button { flex:1; } .ctrl .big { flex:1.3; }
  .ctrl button { height:56px; border-radius:18px; font-size:15px; font-weight:600; }
  .ctrl .big { height:64px; background:#fff; color:#000; border:0; font-size:24px; }
  .goto { display:flex; gap:8px; margin-top:12px; }
  .goto input { padding:12px 14px; font-size:16px; border-radius:14px; text-align:center; font-variant-numeric:tabular-nums; }
  .goto button { padding:0 18px; border-radius:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chips button { padding:8px 13px; border-radius:99px; font-size:14px; }
  .chips button.on { background:#fff; color:#000; border-color:#fff; }
  .sub-lbl { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; margin:16px 4px 2px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="bg"></div>
<main>
  <header>
    <h1>Living Room</h1>
    <div class="pill"><span class="dot" id="dot"></span><span id="now">Connecting…</span></div>
  </header>

  <div class="glass connect" id="connect" hidden>
    <b>Not connected yet</b>
    On your TV, open the <b style="display:inline;font-size:inherit">Cast</b> app and press OK on <b style="display:inline;font-size:inherit">Play from Phone</b>, then scan the QR code. This page remembers it after that.
  </div>

  <div id="ui">
    <section class="glass">
      <div class="field">
        <input id="url" type="url" inputmode="url" placeholder="Paste a video link" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="paste" id="paste" aria-label="Paste"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5"/></svg></button>
      </div>
      <button class="play" id="go">Play on TV</button>
      <div class="msg" id="msg"></div>
    </section>

    <section class="glass" id="np" hidden>
      <div class="np-title" id="npTitle"></div>
      <div class="np-state" id="npState"></div>
      <input type="range" id="scrub" min="0" max="100" step="1" value="0">
      <div class="times"><span id="tPos">0:00</span><span id="tLeft">-0:00</span></div>
      <div class="ctrl">
        <button data-p="seekby" data-d="-30">−30</button>
        <button data-p="seekby" data-d="-10">−10</button>
        <button class="big" id="pp">⏯</button>
        <button data-p="seekby" data-d="10">+10</button>
        <button data-p="seekby" data-d="30">+30</button>
      </div>
      <div class="goto">
        <input id="goto" inputmode="numeric" placeholder="Go to  1:23:45" autocomplete="off">
        <button id="gotoBtn">Go</button>
        <button id="stopBtn" aria-label="Stop">■</button>
      </div>
      <div id="subsWrap" hidden><div class="sub-lbl">Subtitles</div><div class="chips" id="subs"></div></div>
      <div id="audWrap" hidden><div class="sub-lbl">Audio</div><div class="chips" id="auds"></div></div>
    </section>



    <section class="glass hist" id="histCard" hidden><div class="lbl">Recently played</div><div id="hist"></div></section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const say = (t, cls = '') => { $('msg').className = 'msg ' + cls; $('msg').textContent = t; };

// ---- transport: direct to the Mac on home Wi-Fi, or via a private ntfy.sh topic from anywhere ----
const LOCAL = location.port === '8765';
const hashKey = new URLSearchParams(location.hash.slice(1)).get('k');
if (hashKey) { localStorage.setItem('tvkey', hashKey); history.replaceState(null, '', location.pathname); }
const KEY = localStorage.getItem('tvkey');
const waiters = {};
let es;

function send(cmd) {
  if (LOCAL) {
    const r = cmd.t === 'cast' ? ['/cast', { url: cmd.url }] : cmd.t === 'key' ? ['/key/' + cmd.k] :
              cmd.t === 'launch' ? ['/launch/' + cmd.id] : cmd.t === 'type' ? ['/type', { text: cmd.text }] : cmd.t === 'player' ? ['/player', cmd] : null;
    if (cmd.t === 'status') return Promise.all([fetch('/status').then(r => r.json()), fetch('/apps').then(r => r.json())])
      .then(([s, a]) => ({ ...s, apps: (a.apps || []).filter(x => x.id !== 'dev').map(x => ({ id: x.id, name: x.name })) }));
    return fetch(r[0], { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(r[1] || {}) }).then(r => r.json());
  }
  cmd.rid = Math.random().toString(36).slice(2, 10);
  const p = new Promise((res) => { waiters[cmd.rid] = res; setTimeout(() => { if (waiters[cmd.rid]) { delete waiters[cmd.rid]; res({ ok: false, timeout: true, error: cmd.t === 'cast' ? 'Open the Cast app on your TV — the video starts as soon as it opens (within a minute).' : 'Open the Cast app on your TV.' }); } }, 8000); });
  fetch('https://ntfy.sh/' + KEY, { method: 'POST', body: JSON.stringify(cmd) }).catch(() => {});
  return p;
}
function listen() {
  es = new EventSource('https://ntfy.sh/' + KEY + '-r/sse?since=' + (Math.floor(Date.now() / 1000) - 2));
  es.onmessage = e => { try { const m = JSON.parse(JSON.parse(e.data).message); if (waiters[m.rid]) { waiters[m.rid](m); delete waiters[m.rid]; } } catch {} };
}

// ---- actions ----
async function play(url) {
  url = (url || $('url').value).trim();
  if (!url) return say('Paste a link first', 'bad');
  say('Sending to TV…'); $('go').disabled = true;
  const r = await send({ t: 'cast', url });
  r.ok ? (say('▶  ' + r.title, 'ok'), $('url').value = '', refresh()) : say(r.error, 'bad');
  $('go').disabled = false;
}
$('go').onclick = () => play();
$('url').onkeydown = e => { if (e.key === 'Enter') play(); };
$('paste').onclick = async () => {
  try { $('url').value = await navigator.clipboard.readText(); play(); }
  catch { $('url').focus(); say('Long-press the box and tap Paste'); }
};


async function refresh() {
  const r = await send({ t: 'status' });
  $('dot').style.background = $('dot').style.color = r.ok ? 'var(--ok)' : 'var(--bad)';
  $('now').textContent = r.ok ? 'TV ready' : 'Open Cast on TV';
  if (r.player) applyPlayer(r.player);
  const h = r.history || [];
  $('histCard').hidden = !h.length; $('hist').innerHTML = '';
  h.forEach(x => { const d = document.createElement('div'); d.textContent = x.title; d.onclick = () => play(x.url); $('hist').append(d); });
}


// ---- now playing ----
let np = { state: 'idle' }, npAt = 0, scrubbing = false;
const fmt = t => { t = Math.max(0, Math.floor(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const parseT = v => v.trim().split(':').map(Number).reduce((a, b) => a * 60 + b, 0);
const pcmd = (o) => send({ t: 'player', ...o }).then(r => { r.ok || say(r.error || 'TV did not respond', 'bad'); setTimeout(pollNow, 700); return r; });
function curPos() { return np.state === 'playing' ? (np.pos || 0) + (Date.now() - npAt) / 1000 : (np.pos || 0); }
function paint() {
  const live = np.state && np.state !== 'idle' && np.state !== 'stopped' && np.state !== 'finished';
  $('np').hidden = !live; if (!live) return;
  const pos = Math.min(curPos(), np.dur || 0), dur = np.dur || 0;
  $('npTitle').textContent = np.title || 'Playing';
  $('npState').textContent = { playing: 'Playing', paused: 'Paused', buffering: 'Loading…' }[np.state] || np.state;
  $('pp').textContent = np.state === 'paused' ? '▶' : '❚❚';
  const canSeek = np.seekable !== false;
  document.querySelectorAll('[data-p]').forEach(b => b.hidden = !canSeek);
  $('scrub').disabled = !canSeek; document.querySelector('.goto').hidden = !canSeek;
  $('npState').textContent += canSeek ? '' : '  ·  Skipping isn\'t possible in MKV files on Roku';
  if (!scrubbing) { $('scrub').max = Math.max(1, Math.floor(dur)); $('scrub').value = Math.floor(pos); }
  const v = scrubbing ? +$('scrub').value : pos;
  $('scrub').style.setProperty('--p', (dur ? v / dur * 100 : 0) + '%');
  $('tPos').textContent = fmt(v); $('tLeft').textContent = '-' + fmt(dur - v);
}
function chips(el, wrap, items, cur, onPick, withOff) {
  $(wrap).hidden = !(items && items.length); if ($(wrap).hidden) return;
  const key = JSON.stringify([items, cur]); if ($(el).dataset.k === key) return; $(el).dataset.k = key;
  $(el).innerHTML = '';
  (withOff ? [{ id: 'off', name: 'Off' }, ...items] : items).forEach(t => {
    const b = document.createElement('button'); b.textContent = t.name; b.className = String(t.id) === String(cur) ? 'on' : '';
    b.onclick = () => onPick(t.id); $(el).append(b);
  });
}
function applyPlayer(p) {
  if (!p) return; np = p; npAt = Date.now(); paint();
  chips('subs', 'subsWrap', p.subs, p.sub || 'off', id => pcmd({ cmd: 'subs', track: id }), true);
  chips('auds', 'audWrap', (p.audio || []).length > 1 ? p.audio : [], p.aud, id => pcmd({ cmd: 'audio', track: id }), false);
}
async function pollNow() { const r = await send({ t: 'status' }); if (r.player) applyPlayer(r.player); return r; }
$('scrub').addEventListener('input', () => { scrubbing = true; paint(); });
$('scrub').addEventListener('change', () => { const to = +$('scrub').value; scrubbing = false; np.pos = to; npAt = Date.now(); pcmd({ cmd: 'seek', to: String(to) }); });
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { np.pos = curPos() + +b.dataset.d; npAt = Date.now(); paint(); pcmd({ cmd: 'seekby', d: b.dataset.d }); });
$('pp').onclick = () => { np.state = np.state === 'paused' ? 'playing' : 'paused'; np.pos = curPos(); npAt = Date.now(); paint(); pcmd({ cmd: 'toggle' }); };
$('gotoBtn').onclick = () => { const t = parseT($('goto').value); if (!isNaN(t)) { pcmd({ cmd: 'seek', to: String(t) }); $('goto').value = ''; } };
$('goto').onkeydown = e => { if (e.key === 'Enter') $('gotoBtn').click(); };
$('stopBtn').onclick = () => pcmd({ cmd: 'stop' });
setInterval(paint, 500);
setInterval(() => { if (document.visibilityState === 'visible' && (LOCAL || np.state !== 'idle')) pollNow(); }, LOCAL ? 2000 : 10000);

if (!LOCAL && !KEY) { $('connect').hidden = false; $('ui').hidden = true; $('now').textContent = 'Not connected'; }
else {
  if (!LOCAL) listen();
  const pre = new URLSearchParams(location.search).get('url');
  if (pre) play(pre);
  refresh();
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && refresh());
}
</script>
</body>
</html>
